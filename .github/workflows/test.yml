name: Test

on:
  push:
    branches:
      - develop
      - stage
      - d/**
  pull_request:

# Least privilege: these jobs only read the repo. Overrides the repo's
# write-all default so a compromised dependency in install/test can't push.
permissions:
  contents: read

jobs:
  build-dev:
    name: Build (dev)
    runs-on: ubuntu-22.04
    environment: develop
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build vocdoni app (dev)
        run: pnpm build
        env:
          VOCDONI_ENVIRONMENT: dev
          CUSTOM_ORGANIZATION_DOMAINS: ${{ secrets.CUSTOM_ORGANIZATION_DOMAINS }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          CALCOM_EVENT_SLUG: ${{ secrets.CALCOM_EVENT_SLUG }}
          VIDEO_TUTORIAL: '{"en": "https://www.youtube.com/watch?v=OQRF_4-zGSk", "es": "https://www.youtube.com/watch?v=zk6yIq3-SHw"}'

  build-stg:
    name: Build (stg)
    runs-on: ubuntu-22.04
    environment: stage
    # Only run for pushes/PRs to stage branch or d/** branches
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/stage' || startsWith(github.ref, 'refs/heads/d/'))) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'stage' || startsWith(github.base_ref, 'd/')))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build vocdoni app (stg)
        run: pnpm build
        env:
          VOCDONI_ENVIRONMENT: prod
          CUSTOM_ORGANIZATION_DOMAINS: ${{ secrets.CUSTOM_ORGANIZATION_DOMAINS }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          CALCOM_EVENT_SLUG: ${{ secrets.CALCOM_EVENT_SLUG }}
          SAAS_URL: https://saas-api-stg.vocdoni.net

  # Renders the app with the stress theme against the snapshot's mock SaaS (no docker, no backend) and fails on
  # elements that kept a stock value. See scripts/ui-snapshot/README.md, "Stress theme".
  stress-theme:
    name: Stress theme
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for app changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- src scripts/ui-snapshot; then
            echo "Nothing changed under src/ or scripts/ui-snapshot/: no stress run."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@v4

      - name: Install
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        if: steps.changes.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Render with the stress theme
        if: steps.changes.outputs.run == 'true'
        run: pnpm ui:snapshot -- --label stress --theme stress

      - name: Upload the stress run
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stress-theme
          path: .ui-snapshot/stress
          retention-days: 7
