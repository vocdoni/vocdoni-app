name: OCR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    # Release PRs (develop -> stage -> main/lts) carry a diff far too large to
    # review, and their contents have already been reviewed on the way in.
    branches-ignore:
      - stage
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    uses: vocdoni/open-code-review/.github/workflows/claude-review-channel.yml@ocr-stable
    with:
      gateway_url: https://claude.vocdoni.net
      runner_labels: '["self-hosted"]'
      # Uses the repository/organization OCR_MODEL variable, or the default model.
      # Uncomment to override it for this repository:
      # model: claude-gpt-6-astra
    secrets:
      gateway_token: ${{ secrets.OCR_GATEWAY_AUTH_TOKEN }}
