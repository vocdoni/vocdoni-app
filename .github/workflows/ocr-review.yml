name: OCR review

on:
  pull_request_target:
    # Opt-in: the review only runs when a maintainer applies the `ocr-review`
    # label. Pushes to an already-labeled PR do not re-run it; remove and re-add
    # the label to request a fresh review.
    types: [labeled]
    # Filters on the PR base branch. Release PRs (develop -> stage -> main, the
    # lts deployment) carry a diff far too large to review, and their contents
    # were already reviewed on the way into develop. Hotfix PRs raised straight
    # against stage or main are skipped too, as a deliberate trade-off for
    # keeping the rule a plain base-branch filter.
    branches-ignore:
      - stage
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Every label added to a PR triggers this workflow. Only `ocr-review` events
  # share the per-PR group, so adding an unrelated label cannot cancel a review
  # that is already running.
  group: >-
    ${{ github.event.label.name == 'ocr-review'
    && format('ocr-{0}', github.event.pull_request.number)
    || format('ocr-skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.label.name == 'ocr-review' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    uses: vocdoni/open-code-review/.github/workflows/claude-review-channel.yml@ocr-stable
    with:
      gateway_url: https://claude.vocdoni.net
      runner_labels: '["self-hosted"]'
      # Uses the repository/organization OCR_MODEL variable, or the default model.
      # Uncomment to override it for this repository:
      # model: claude-gpt-6-astra
    secrets:
      gateway_token: ${{ secrets.OCR_GATEWAY_AUTH_TOKEN }}
