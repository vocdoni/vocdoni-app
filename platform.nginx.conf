# nginx config for the static platform (integrator) SPA. History fallback so client-side
# routes (e.g. /api-keys) resolve on hard refresh / deep link; long-cache the hashed assets.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
