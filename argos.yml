validation:
  env:
    CI: "true"
  install_commands:
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - npm install -g pnpm@10.16.1
    - pnpm config set store-dir /tmp/pnpm-store
    - rm -rf /workspace/node_modules
    - pnpm install --frozen-lockfile
  test_commands:
    - pnpm test
    - pnpm lint
