# Security floors for transitive dependencies (GitHub Dependabot alerts).
# Only add entries here when a dependent actually pins a vulnerable range;
# if every dependent's own range admits the patched version, a lockfile
# refresh is enough and an override would just mask upstream reality.
overrides:
  # viem pins ws 8.18.3 exact and engine.io-client allows only ~8.18.3 —
  # both below the 8.21.0 security fix (GHSA alerts #181/#211).
  'ws@^8': ^8.21.0
  # query-string 7.1.3 (declared by @walletconnect/utils 2.21.x, pulled in
  # transitively by wagmi's bundled connectors) pins decode-uri-component
  # ^0.2.2, below the 0.5.0 DoS fix (GHSA-vcc3-ghjq-m6fr, alert #252).
  # 0.5.0 is ESM-only, which would break query-string's CJS `require()` —
  # but a full node_modules sweep shows nothing ever imports query-string
  # at runtime (walletconnect declares it without using it, and dropped it
  # in 2.24.0), so the jump is safe. Drop this once the wagmi stack pulls
  # @walletconnect/* >= 2.24.
  'decode-uri-component@<0.5.0': ^0.5.0
  # @coinbase/cdp-sdk 1.55.0 pins axios 1.16.0 exact, below the 1.18.0 fix for
  # GHSA-gcfj-64vw-6mp9 (high, inherited-proxy leak via interceptor config
  # cloning) plus several moderate prototype-pollution/DoS advisories. Drop this
  # once @coinbase/cdp-sdk pins axios >= 1.18.0.
  axios: ^1.18.0
  # E2E test build: integrator-sdk packages packed from
  # vocdoni-integrator-sdk `integration/parent-process` (PR #84), and the
  # unreleased @vocdoni/proto 1.18.0 they depend on (dvote-protobuf#86).
  # The tarballs live in the git-ignored .e2e-tarballs/ directory.
  '@vocdoni/api-client': file:./.e2e-tarballs/vocdoni-api-client-2.3.0.tgz
  '@vocdoni/api-types': file:./.e2e-tarballs/vocdoni-api-types-2.2.0.tgz
  '@vocdoni/api-voting': file:./.e2e-tarballs/vocdoni-api-voting-1.2.2.tgz
  '@vocdoni/api-voting-zk': file:./.e2e-tarballs/vocdoni-api-voting-zk-1.0.3.tgz
  '@vocdoni/ballot': file:./.e2e-tarballs/vocdoni-ballot-1.3.0.tgz
  '@vocdoni/metadata-verify': file:./.e2e-tarballs/vocdoni-metadata-verify-0.0.0.tgz
  '@vocdoni/react-components': file:./.e2e-tarballs/vocdoni-react-components-3.1.1.tgz
  '@vocdoni/react-providers': file:./.e2e-tarballs/vocdoni-react-providers-3.0.3.tgz
  '@vocdoni/proto@1.18.0': git+https://github.com/vocdoni/dvote-protobuf.git#04e7afe6fe2b24f1a20fd5f3fbef0b9fdad87e76
