# Security floors for transitive dependencies (GitHub Dependabot alerts).
# Only add entries here when a dependent actually pins a vulnerable range;
# if every dependent's own range admits the patched version, a lockfile
# refresh is enough and an override would just mask upstream reality.
overrides:
  # viem pins ws 8.18.3 exact and engine.io-client allows only ~8.18.3 —
  # both below the 8.21.0 security fix (GHSA alerts #181/#211).
  'ws@^8': ^8.21.0
  # query-string 7.1.3 (declared by @walletconnect/utils 2.21.x, pulled in
  # transitively by wagmi's bundled connectors) pins decode-uri-component
  # ^0.2.2, below the 0.5.0 DoS fix (GHSA-vcc3-ghjq-m6fr, alert #252).
  # 0.5.0 is ESM-only, which would break query-string's CJS `require()` —
  # but a full node_modules sweep shows nothing ever imports query-string
  # at runtime (walletconnect declares it without using it, and dropped it
  # in 2.24.0), so the jump is safe. Drop this once the wagmi stack pulls
  # @walletconnect/* >= 2.24.
  'decode-uri-component@<0.5.0': ^0.5.0
  # @coinbase/cdp-sdk 1.55.0 pins axios 1.16.0 exact, below the 1.18.0 fix for
  # GHSA-gcfj-64vw-6mp9 (high, inherited-proxy leak via interceptor config
  # cloning) plus several moderate prototype-pollution/DoS advisories. Drop this
  # once @coinbase/cdp-sdk pins axios >= 1.18.0.
  axios: ^1.18.0
  # GHSA-mrhx-c7xc-m3w5 (alert #293) has no zod 3 fix. @coinbase/cdp-sdk and
  # @chakra-ui/cli ask for ^3.25.76 and @reown/appkit-wallet pins 3.22.4; all of
  # them only use basic schema API, which zod >= 4.6 still provides (one-argument
  # z.record() included), and none of their zod code reaches dist/. Drop this
  # once those packages move to zod 4.
  'zod@<4.6.6': ^4.6.7
  # Unreleased integrator-sdk builds (vocdoni-integrator-sdk#113 and #114 merged
  # onto main), packed into vendor/vocdoni/. The packages pin each other at the
  # unpublished versions, so the transitive copies must point at the same
  # tarballs. Drop these, the vendor/ tarballs, the file: specs in
  # package.json and the Dockerfile `COPY vendor ./vendor` line once the
  # release is on npm.
  '@vocdoni/api-client': file:vendor/vocdoni/vocdoni-api-client-2.8.0.tgz
  '@vocdoni/api-types': file:vendor/vocdoni/vocdoni-api-types-2.6.0.tgz
  '@vocdoni/api-voting': file:vendor/vocdoni/vocdoni-api-voting-1.3.3.tgz
  '@vocdoni/ballot': file:vendor/vocdoni/vocdoni-ballot-1.4.0.tgz
  '@vocdoni/react-components': file:vendor/vocdoni/vocdoni-react-components-5.0.0.tgz
  '@vocdoni/react-providers': file:vendor/vocdoni/vocdoni-react-providers-4.1.0.tgz
