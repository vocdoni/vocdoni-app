# DigitalOcean App Platform spec for the platform (integrator) static SPA.
#
# This builds the SEPARATE platform target (vite.platform.config.ts → dist-platform) from this
# repo and serves it as a static site at platform.vocdoni.io. The end-user app is a different DO
# app (Docker service, see /Dockerfile) and is unaffected.
#
# Usage (the vocdoni.io DNS zone is DO-managed, so the domain + TLS cert are provisioned
# automatically):
#   doctl apps spec validate .do/platform-app.yaml
#   # repoint the existing "integrator-app" app (id a4b8acc0-eed3-4a0e-bc97-8f2e9b30a86e):
#   doctl apps update <app-id> --spec .do/platform-app.yaml
#   # or create a fresh app:
#   doctl apps create --spec .do/platform-app.yaml
#
# Branch: track `develop` for a preview that mirrors app-dev.vocdoni.io; switch to the production
# branch when platform.vocdoni.io should follow production. The platform code is only present once
# PR #1700 is merged into the tracked branch.
name: platform-app
region: fra
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
domains:
  - domain: platform.vocdoni.app
    type: ALIAS
ingress:
  rules:
    - component:
        name: platform
      match:
        path:
          prefix: /
static_sites:
  - name: platform
    github:
      repo: vocdoni/vocdoni-app
      branch: feat/platform-integrator-build
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    # The node-js buildpack runs `pnpm install` (which triggers the `prepare` chakra typegen).
    # We then build the platform target and rename its entry so the SPA catchall serves it.
    build_command: pnpm prepare && pnpm build:platform && mv dist-platform/index.platform.html dist-platform/index.html
    output_dir: dist-platform
    catchall_document: index.html
    envs:
      - key: VITE_SAAS_URL
        scope: BUILD_TIME
        value: https://saas-api-dev.vocdoni.net
      # Stripe publishable key (public by design) — same value as vocdoni-app-dev.
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        scope: BUILD_TIME
        value: pk_test_51SARU0DVLCZ006PWfdsEDOvLOmwN25FF6mlXwfPeqXWWFswoYii6hHggtSKb6PFzToyJSIthATYcF9KKSUTm7uBR00B6qgZ7Ss
